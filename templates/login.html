<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入｜莊停車場</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-body"><div class="login-card"><div class="brand login-brand"><span class="brand-mark">P</span><span><strong>莊停車場</strong><small>SMART PARKING</small></span></div><p class="eyebrow">ADMINISTRATOR LOGIN</p><h1>管理系統登入</h1><p class="subtext">登入後可操作模擬器、管理車牌與閘門。</p>{% if error %}<div class="inline-warning">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">管理員密碼</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="submit" class="btn primary full">登入控制台</button></form><a class="login-link" href="/display">↗ 查看公開車位看板</a></div></body></html>
